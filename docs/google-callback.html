<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Xác thực Google — TungDevAI</title>
  <link rel="icon" href="assets/tungdevai-core-logo.jpg?v=core2026" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #070b16;
      color: #f0f6fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .auth-transit-card {
      background: #0d1527;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(14, 165, 233, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-pulse-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .transit-logo {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.3);
      object-fit: cover;
    }
    .transit-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-top-color: #38bdf8;
      border-right-color: #0ea5e9;
      animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .transit-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f0f6fc;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }
    .transit-msg {
      font-size: 0.92rem;
      color: #94a3b8;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 380px;
    }
    .transit-err {
      color: #f87171 !important;
      text-align: left !important;
      font-size: 0.85rem !important;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 1rem;
      width: 100%;
    }
    .btn-return-login {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 1.5rem;
      padding: 9px 20px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 999px;
      color: #7dd3fc;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-return-login:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.4);
      color: #ffffff;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="auth-transit-card">
    <div class="logo-pulse-wrap" id="transitSpinner">
      <img src="assets/tungdevai-core-logo.jpg?v=core2026" alt="TungDevAI" class="transit-logo" />
      <div class="transit-ring"></div>
    </div>
    <div class="transit-title" id="transitTitle">Đang kết nối Google…</div>
    <p class="transit-msg" id="msg">Đang xác thực với TungDevAI Studio…</p>
    <a id="backLogin" href="login.html" class="btn-return-login" hidden>← Về trang đăng nhập</a>
  </div>
  <script>
    (function () {
      var LS_SESSION = "jarvis_google_session_v1";
      var LS_USER = "jarvis_google_user_v1";
      var SS_TOKEN = "tung_google_id_token";
      var SS_RETURN = "tung_google_return";
      var msg = document.getElementById("msg");
      var title = document.getElementById("transitTitle");
      var back = document.getElementById("backLogin");

      function originHelp() {
        var o = (location.origin || "").replace(/\/$/, "");
        return (
          "Google Error 400 / redirect_uri_mismatch.\n\n" +
          "Vào Google Cloud Console → OAuth client → thêm:\n" +
          "Origins: " + o + "\nRedirect: " + o + "/google-callback.html"
        );
      }

      function fail(t) {
        var text = t || "Lỗi đăng nhập Google";
        if (/redirect_uri_mismatch|origin_mismatch|Error 400|invalid_request|400\.|access_denied/i.test(text)) {
          if (/access_denied/i.test(text)) {
            text = "Google từ chối.\nNếu app đang Testing: Thêm email vào Test users.";
          } else {
            text = originHelp();
          }
        }
        title.textContent = "Không thể đăng nhập";
        msg.textContent = text;
        msg.className = "transit-msg transit-err";
        back.hidden = false;
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage(
              { type: "tungdevai-google-auth", error: text },
              location.origin
            );
          }
        } catch (e) {}
        if (window.opener) {
          setTimeout(function () {
            try { window.close(); } catch (e2) {}
          }, 3500);
        }
      }

      function setMsg(t) {
        msg.textContent = t;
      }

      function isStaticHost() {
        var host = (location.hostname || "").toLowerCase();
        return host.indexOf("github.io") !== -1 || location.protocol === "file:";
      }

      function isLoopback(url) {
        return /^(https?:\/\/)?(127\.0\.0\.1|localhost)(:\d+)?/i.test(
          String(url || "")
        );
      }

      async function resolveApiBase() {
        var origin = (location.origin || "").replace(/\/$/, "");
        if (!isStaticHost() && origin.indexOf("http") === 0) {
          return origin;
        }
        try {
          var r = await fetch("config.json?v=24", { cache: "no-store" });
          if (r.ok) {
            var j = await r.json();
            var b = String((j && j.apiBase) || "")
              .trim()
              .replace(/\/$/, "");
            if (b && !isLoopback(b)) return b;
          }
        } catch (_) {}
        try {
          var ls = (localStorage.getItem("jarvis_api_base_v2") || "")
            .trim()
            .replace(/\/$/, "");
          if (ls && !isLoopback(ls)) return ls;
        } catch (_) {}
        return "";
      }

      async function completeLogin(token) {
        if (!token) {
          fail("Không có token Google.");
          return;
        }

        // Desktop popup: gửi về opener và đóng ngay lập tức
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage(
              { type: "tungdevai-google-auth", credential: token },
              location.origin
            );
            title.textContent = "Thành công!";
            setMsg("Đã xác thực — đang vào app…");
            setTimeout(function () {
              try { window.close(); } catch (e) {}
            }, 100);
            return;
          } catch (e) {}
        }

        title.textContent = "Đang đồng bộ…";
        setMsg("Xác thực phiên làm việc với server…");
        var api = await resolveApiBase();
        if (!api) {
          fail("Chưa có server API. Mở đúng link domain đang chạy.");
          return;
        }
        try {
          var r = await fetch(api + "/api/auth/google", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true",
            },
            body: JSON.stringify({ credential: token }),
          });
          var text = await r.text();
          var data;
          try {
            data = JSON.parse(text);
          } catch (_) {
            data = { detail: text };
          }
          if (!r.ok) {
            var d = data.detail;
            var err = typeof d === "string" ? d : d ? JSON.stringify(d) : text || "Lỗi server";
            fail("Server từ chối token:\n" + err);
            return;
          }
          try {
            localStorage.setItem(LS_SESSION, data.session_token || "");
            localStorage.setItem("jarvis_session_token", data.session_token || "");
            localStorage.setItem(LS_USER, JSON.stringify(data.user || {}));
            // Cookie 90 ngày
            var expDate = new Date(Date.now() + 90 * 86400 * 1000).toUTCString();
            document.cookie = "tungdev_session=" + encodeURIComponent(data.session_token || "") + "; path=/; expires=" + expDate + "; SameSite=Lax";
          } catch (e) {
            fail("Không lưu được phiên đăng nhập.");
            return;
          }
          try {
            sessionStorage.removeItem(SS_TOKEN);
          } catch (_) {}

          var ret = "chat.html";
          try {
            var r2 = sessionStorage.getItem(SS_RETURN);
            if (r2 && /\.html$/i.test(r2) && r2.indexOf("login") === -1 && r2.indexOf("register") === -1) {
              ret = r2;
            }
          } catch (_) {}

          title.textContent = "Chào mừng bạn!";
          setMsg("Chuyển tiếp đến Studio…");
          location.replace(ret);
        } catch (e) {
          fail("Không kết nối được server API (" + api + ").");
        }
      }

      function parseTokenFromUrl() {
        var hash = (location.hash || "").replace(/^#/, "");
        var q = new URLSearchParams(hash);
        var idToken = q.get("id_token") || q.get("credential");
        var err = q.get("error");
        var desc = q.get("error_description");
        if (err) return { error: err + (desc ? ": " + desc : "") };
        if (idToken) return { token: idToken };

        var qs = new URLSearchParams(location.search);
        err = qs.get("error");
        desc = qs.get("error_description");
        if (err) return { error: err + (desc ? ": " + desc : "") };
        idToken = qs.get("id_token") || qs.get("credential");
        if (idToken) return { token: idToken };

        try {
          var t = (sessionStorage.getItem(SS_TOKEN) || "").trim();
          if (t) return { token: t };
        } catch (_) {}

        return null;
      }

      try {
        var parsed = parseTokenFromUrl();
        if (!parsed) {
          fail("Không nhận được token từ Google.\n\n" + originHelp());
          return;
        }
        if (parsed.error) {
          fail(parsed.error);
          return;
        }
        try {
          history.replaceState(null, "", location.pathname + location.search);
        } catch (_) {}
        completeLogin(parsed.token);
      } catch (e) {
        fail(String(e.message || e));
      }
    })();
  </script>
</body>
</html>
