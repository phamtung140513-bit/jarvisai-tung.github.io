<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Đăng nhập — TUNGAI.FUN Studio</title>
  <meta name="description" content="Đăng nhập TUNGAI.FUN Studio Pro" />
  <meta name="theme-color" content="#050713" />
  <link rel="icon" href="assets/tungdevai-core-logo.jpg?v=core2026" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="chat.css?v=mint4" />
  <script src="boot-redirect.js?v=25"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="auth-gate">
    <div class="auth-card">
      <a href="./" class="auth-brand-link" title="Về trang chủ">
        <img src="assets/tungdevai-core-logo.jpg?v=core2026" alt="TUNGAI.FUN" class="auth-logo" />
      </a>
      <h1>Đăng Nhập Studio</h1>
      <p class="auth-sub">Chào mừng trở lại TUNGAI.FUN — Trợ lý AI Coding & Công Nghệ.</p>

      <form id="formLogin" class="auth-form" autocomplete="on">
        <label class="auth-label" for="loginEmail">Email</label>
        <input class="auth-input" id="loginEmail" type="email" placeholder="name@domain.com" required autocomplete="email" />
        
        <label class="auth-label" for="loginPassword">Mật khẩu</label>
        <input class="auth-input" id="loginPassword" type="password" placeholder="••••••••" required minlength="6" autocomplete="current-password" />

        <div style="display: flex; align-items: center; justify-content: space-between; margin: 0.5rem 0 1rem 0; font-size: 0.85rem; color: #94a3b8;">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="rememberMe" checked style="accent-color: #6366f1;" />
            <span>Ghi nhớ đăng nhập (90 ngày)</span>
          </label>
        </div>
        
        <button type="submit" class="auth-primary" id="btnLoginSubmit">Đăng Nhập Vào Studio →</button>
      </form>

      <div class="auth-divider"><span>hoặc tiếp tục với</span></div>

      <!-- Google Sign-In Premier Button at Bottom -->
      <div id="googleBtnWrap" class="google-btn-wrap">
        <button type="button" class="auth-primary" id="btnGoogleContinue" style="width: 100%; background: #ffffff; color: #1f1f1f; border: 1px solid #dadce0; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Tiếp tục với Google</span>
        </button>
      </div>

      <p class="auth-hint" id="authHint"></p>
      <p class="auth-err hidden" id="authErr"></p>
      <p class="auth-ok hidden" id="authOk"></p>

      <p class="auth-switch">
        Chưa có tài khoản?
        <a href="register.html">Đăng ký ngay</a>
      </p>
      <p class="auth-foot">
        <a href="./">Trang chủ</a> · <a href="chat.html">Vào Web Chat</a>
      </p>
    </div>
  </div>
  <script src="auth.js?v=28"></script>
  <script>TungAuth.init("login");</script>
</body>
</html>
